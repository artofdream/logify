name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: gofmt (no unformatted files)
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then
            echo "Not gofmt-formatted:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -o /tmp/logify ./cmd/logify

      - name: go test
        run: go test ./... -v

      - name: fixture bundle smoke test
        run: |
          /tmp/logify -output /tmp/sample-report.html testdata/case
          test -s /tmp/sample-report.html
          grep -q "<!doctype html>" /tmp/sample-report.html

      - name: whitespace/diff check (PRs only)
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.event.pull_request.base.ref }}...HEAD"

  # Enables GitHub's native auto-merge on a PR once `validate` passes, so a
  # green PR merges itself against branch-protection's required status check
  # with no separate "approve" step to fake. This uses the workflow's own
  # built-in GITHUB_TOKEN (scoped to this repo/PR only) - no external
  # credentials, no bot identity posting a review.
  #
  # Requires one-time repo setup (Settings, not something this workflow can
  # do for you):
  #   1. Settings -> General -> Pull Requests -> check "Allow auto-merge".
  #   2. Settings -> Branches -> branch protection rule on `main`:
  #      check "Require status checks to pass before merging" and select the
  #      `validate` job (it appears in the list after this workflow has run
  #      at least once). Leave "Require approvals" at 0 - the check is the
  #      gate, not a rubber-stamped review.
  enable-auto-merge:
    name: enable auto-merge
    needs: validate
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
